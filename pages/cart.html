<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechWear Shop — Carrito</title>
    <link rel="icon" href="../img/logo/icon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/cart.css" />
  </head>
  <body>
    <div>
      <header>
        <div>
          <a href="../index.html"
            ><img src="../img/logo/logo.png" alt="logo de TechWear Shop" />
            TechWear Shop</a
          >
          <nav aria-label="Principal">
            <ul>
              <li>
                <a href="../index.html">
                  <i class="fa-solid fa-house"></i> Inicio</a
                >
              </li>
              <li>
                <a class="active" href="cart.html"
                  ><i class="fa-solid fa-cart-shopping"></i> Carrito
                </a>
              </li>
              <li>
                <a href="login.html"
                  ><i class="fa-solid fa-user"></i> Ingresar</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main id="cart-page">
        <div id="cart-header">
          <h2>Carrito de compras</h2>
          <label>Progreso del pedido</label>
          <progress value="33" max="100"></progress>
          <p>33% completo</p>
          <div id="cart-location">
            <span>Selecciona tu ubicación</span>
            <a
              class="btn-icon"
              href="https://www.google.com/maps"
              target="_blank"
              rel="noreferrer"
            >
              <i class="fa-solid fa-location-dot"></i>
            </a>
          </div>
        </div>
        <br />
        <div id="cart-content">
          <section id="cart-items">
            <p class="empty-cart-message">
              Tu carrito está vacío. Agrega productos desde la tienda.
            </p>
          </section>

          <aside class="cart-summary">
            <h3>Resumen del pedido</h3>
            <dl>
              <div>
                <dt>Subtotal</dt>
                <dd id="cartSubtotal">$0.00</dd>
              </div>
              <div>
                <dt>Impuesto (10%)</dt>
                <dd id="cartTax">$0.00</dd>
              </div>
              <div>
                <dt>Total</dt>
                <dd id="cartTotal" class="total">$0.00</dd>
              </div>
            </dl>
            <div id="cart-footer">
              <button id="cartCheckout">Proceder al pago</button>
            </div>
          </aside>
        </div>
      </main>

      <footer>
        <div>
          <p>&copy; 2026 TechWear Shop. All rights reserved.</p>
        </div>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/cart.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
