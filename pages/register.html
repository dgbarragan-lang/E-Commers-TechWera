<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechWear Shop — Registrarse</title>
    <link rel="icon" href="../img/logo/icon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div>
      <header>
        <div>
          <a href="../index.html"
            ><img src="../img/logo/logo.png" alt="logo de TechWear Shop" />
            TechWear Shop</a
          >
          <nav aria-label="Principal">
            <ul>
              <li>
                <a href="../index.html"
                  ><i class="fa-solid fa-house"></i> Inicio</a
                >
              </li>
              <li>
                <a href="cart.html"
                  ><i class="fa-solid fa-cart-shopping"></i> Carrito</a
                >
              </li>
              <li>
                <a href="login.html"
                  ><i class="fa-solid fa-user"></i> Ingresar</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main id="register-page">
        <section id="signup-panel">
          <h2>Crear una cuenta</h2>
          <hr />
          <form class="register-form" action="login.html" method="get">
            <div class="form-row-inline">
              <div class="form-row">
                <label for="first">Nombre</label>
                <input id="first" name="first" type="text" required />
              </div>
              <div class="form-row">
                <label for="last">Apellido</label>
                <input id="last" name="last" type="text" required />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div class="form-row">
                <label for="phone">Teléfono</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  placeholder="+593 555 555 5555"
                />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required />
              </div>
              <div class="form-row">
                <label for="confirm">Confirmar contraseña</label>
                <input id="confirm" name="confirm" type="password" required />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="company">Empresa</label>
                <input id="company" name="company" type="text" />
              </div>
              <div class="form-row">
                <label for="dob">Fecha de nacimiento</label>
                <input id="dob" name="dob" type="date" />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="address1">Dirección 1</label>
                <input id="address1" name="address1" type="text" />
              </div>
              <div class="form-row">
                <label for="address2">Dirección 2</label>
                <input id="address2" name="address2" type="text" />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="city">Ciudad</label>
                <input id="city" name="city" type="text" />
              </div>
              <div class="form-row">
                <label for="state">Provincia / Estado</label>
                <input id="state" name="state" type="text" />
              </div>
            </div>

            <div class="form-row-inline">
              <div class="form-row">
                <label for="zip">Código postal</label>
                <input id="zip" name="zip" type="text" />
              </div>
              <div class="form-row">
                <label for="countrySearch">Buscar nacionalidad</label>
                <input
                  id="countrySearch"
                  type="search"
                  placeholder="Escribe el nombre del país"
                />
              </div>
              <div class="form-row">
                <label for="country">País</label>
                <select id="country" name="country">
                  <option value="">Selecciona un país</option>
                </select>
                <div id="countryPreview" class="country-preview"></div>
              </div>
            </div>

            <div class="checkbox-group">
              <label
                ><input type="checkbox" name="newsletter" /> Suscribirse al
                boletín</label
              >
              <label
                ><input type="checkbox" name="terms" required /> Acepto los
                términos y la política de privacidad</label
              >
            </div>

            <button type="submit">Crear cuenta</button>
          </form>
          <hr />
        </section>
      </main>

      <footer>
        <div>
          <p>&copy; 2026 TechWear Shop. All rights reserved.</p>
        </div>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/register.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
