<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechWear Shop — Iniciar sesión</title>
    <link rel="icon" href="../img/logo/icon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div>
      <header>
        <div>
          <a href="../index.html"
            ><img src="../img/logo/logo.png" alt="logo de TechWear Shop" />
            TechWear Shop</a
          >
          <nav aria-label="Principal">
            <ul>
              <li>
                <a href="../index.html">
                  <i class="fa-solid fa-house"></i> Inicio</a
                >
              </li>
              <li>
                <a href="cart.html"
                  ><i class="fa-solid fa-cart-shopping"></i> Carrito</a
                >
              </li>
              <li>
                <a class="active" href="login.html"
                  ><i class="fa-solid fa-user"></i> Ingresar</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main id="login-page">
        <section id="sign-in-panel" aria-labelledby="signin-title">
          <h2 id="signin-title">Inicia sesión en tu cuenta</h2>
          <hr />
          <form class="auth-form">
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="tu@correo.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit">Iniciar sesión</button>
          </form>
          <hr />
          <p class="form-note">
            ¿No tienes cuenta?
            <a class="form-link" href="register.html">Crear cuenta</a>
          </p>
        </section>
      </main>

      <footer>
        <div>
          <p>&copy; 2026 TechWear Shop. All rights reserved.</p>
        </div>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/login.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
